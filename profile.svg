<svg width="1200" height="1650" viewBox="0 0 1200 1650" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="1650">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 92px;
        font-weight: 900;
        letter-spacing: 6px;
        fill: #F8FAFC;
      }

      .subtitle {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 24px;
        font-weight: 600;
        fill: #94A3B8;
      }

      .section {
        font-family: JetBrains Mono, Fira Code, Consolas, monospace;
        font-size: 25px;
        font-weight: 800;
        fill: #F8FAFC;
        letter-spacing: 1px;
      }

      .body {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 21px;
        fill: #CBD5E1;
      }

      .small {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 18px;
        fill: #94A3B8;
      }

      .code {
        font-family: JetBrains Mono, Fira Code, Consolas, monospace;
        font-size: 18px;
        fill: #BAE6FD;
      }

      .code2 {
        font-family: JetBrains Mono, Fira Code, Consolas, monospace;
        font-size: 17px;
        fill: #67E8F9;
      }

      .muted {
        fill: #64748B;
      }

      .accent {
        fill: #22D3EE;
      }

      .stroke {
        stroke: #22D3EE;
      }
    </style>
  </defs>

  <rect width="1200" height="1650" fill="url(#bg)"/>

  <!-- background grid -->
  <g opacity="0.12">
    <path d="M0 120 H1200 M0 240 H1200 M0 360 H1200 M0 480 H1200 M0 600 H1200 M0 720 H1200 M0 840 H1200 M0 960 H1200 M0 1080 H1200 M0 1200 H1200 M0 1320 H1200 M0 1440 H1200" stroke="#38BDF8"/>
    <path d="M120 0 V1650 M240 0 V1650 M360 0 V1650 M480 0 V1650 M600 0 V1650 M720 0 V1650 M840 0 V1650 M960 0 V1650 M1080 0 V1650" stroke="#38BDF8"/>
  </g>

  <!-- glow blobs -->
  <circle cx="940" cy="150" r="170" fill="#0891B2" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="180" cy="1250" r="210" fill="#7C3AED" opacity="0.13" filter="url(#softGlow)"/>
  <circle cx="980" cy="1260" r="190" fill="#22D3EE" opacity="0.12" filter="url(#softGlow)"/>

  <!-- top chrome -->
  <rect x="70" y="55" width="1060" height="1540" rx="34" fill="#020617" opacity="0.55" stroke="#1E293B"/>
  <circle cx="110" cy="95" r="8" fill="#EF4444"/>
  <circle cx="136" cy="95" r="8" fill="#F59E0B"/>
  <circle cx="162" cy="95" r="8" fill="#22C55E"/>
  <text x="198" y="103" class="code muted">adnaan / README.md</text>

  <!-- hero -->
  <g transform="translate(110 155)">
    <text x="0" y="95" class="title">ADNAAN</text>
    <rect x="5" y="122" width="650" height="3" fill="url(#cyan)" filter="url(#glow)"/>
    <text x="0" y="170" class="subtitle">Developer  ·  Builder  ·  Open Source Explorer</text>

    <text x="0" y="235" class="code2">&gt; Turning ideas into clean, useful, human-friendly software.</text>

    <!-- terminal icon -->
    <rect x="805" y="0" width="180" height="180" rx="34" fill="#03111F" stroke="#22D3EE" stroke-width="3" filter="url(#glow)"/>
    <path d="M860 65 L895 90 L860 115" stroke="#22D3EE" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M918 120 H955" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- angled divider -->
  <path d="M110 455 L1090 390" stroke="url(#cyan)" stroke-width="2" opacity="0.8"/>
  <circle cx="1090" cy="390" r="6" fill="#22D3EE" filter="url(#glow)"/>

  <!-- card 1 large left -->
  <g transform="translate(110 500)">
    <path d="M0 0 H615 L655 40 V385 H0 Z" fill="url(#card)" stroke="#1E293B"/>
    <path d="M0 0 H260 L300 40 H0 Z" fill="#0F172A"/>
    <text x="26" y="50" class="section">01 · IDENTITY</text>

    <rect x="28" y="88" width="540" height="160" rx="18" fill="#020617" stroke="#1E293B"/>
    <text x="55" y="130" class="code">const adnaan = {</text>
    <text x="75" y="162" class="code">role: "Developer &amp; Builder",</text>
    <text x="75" y="194" class="code">focus: ["Code", "Products", "Impact"],</text>
    <text x="75" y="226" class="code">status: "Always Building"</text>
    <text x="55" y="258" class="code">};</text>

    <text x="28" y="305" class="body">I craft digital products that feel clear, practical,</text>
    <text x="28" y="338" class="body">and alive — blending clean engineering with</text>
    <text x="28" y="371" class="body">product-minded thinking.</text>
  </g>

  <!-- card right tall -->
  <g transform="translate(815 465)">
    <path d="M0 45 L70 0 H275 V430 H35 L0 395 Z" fill="url(#card)" stroke="#1E293B"/>
    <text x="38" y="95" class="section">LIVE</text>
    <text x="38" y="128" class="section">SIGNAL</text>
    <rect x="38" y="160" width="200" height="2" fill="#22D3EE" opacity="0.55"/>

    <text x="38" y="210" class="code2">&gt; booting profile</text>
    <text x="38" y="242" class="code2">&gt; loading ideas</text>
    <text x="38" y="274" class="code2">&gt; compiling craft</text>
    <text x="38" y="306" class="code2">&gt; shipping value</text>

    <rect x="38" y="344" width="190" height="46" rx="23" fill="#062536" stroke="#22D3EE"/>
    <circle cx="68" cy="367" r="7" fill="#22C55E" filter="url(#glow)"/>
    <text x="90" y="374" class="code2">ONLINE</text>
  </g>

  <!-- tech arsenal -->
  <g transform="translate(110 930)">
    <path d="M0 0 H465 L505 40 V325 H0 Z" fill="url(#card)" stroke="#1E293B"/>
    <text x="28" y="55" class="section">02 · TECH ARSENAL</text>

    <g transform="translate(30 100)">
      <rect x="0" y="0" width="90" height="42" rx="13" fill="#111827" stroke="#22D3EE"/>
      <text x="21" y="28" class="code2">JS</text>

      <rect x="105" y="0" width="90" height="42" rx="13" fill="#111827" stroke="#22D3EE"/>
      <text x="124" y="28" class="code2">TS</text>

      <rect x="210" y="0" width="120" height="42" rx="13" fill="#111827" stroke="#22D3EE"/>
      <text x="230" y="28" class="code2">PYTHON</text>

      <rect x="345" y="0" width="90" height="42" rx="13" fill="#111827" stroke="#22D3EE"/>
      <text x="367" y="28" class="code2">GIT</text>

      <rect x="0" y="60" width="120" height="42" rx="13" fill="#111827" stroke="#22D3EE"/>
      <text x="21" y="88" class="code2">REACT</text>

      <rect x="135" y="60" width="120" height="42" rx="13" fill="#111827" stroke="#22D3EE"/>
      <text x="158" y="88" class="code2">NEXT</text>

      <rect x="270" y="60" width="135" height="42" rx="13" fill="#111827" stroke="#22D3EE"/>
      <text x="292" y="88" class="code2">DOCKER</text>
    </g>

    <text x="30" y="250" class="body">Tools are temporary.</text>
    <text x="30" y="283" class="body">The builder mindset is permanent.</text>
  </g>

  <!-- philosophy slanted -->
  <g transform="translate(660 900)">
    <path d="M40 0 H430 V330 H0 V55 Z" fill="url(#card)" stroke="#1E293B"/>
    <text x="52" y="68" class="section">03 · PHILOSOPHY</text>

    <text x="52" y="125" class="body">Build with clarity.</text>
    <text x="52" y="165" class="body">Move with purpose.</text>
    <text x="52" y="205" class="body">Ship before perfect.</text>
    <text x="52" y="245" class="body">Improve through iteration.</text>

    <path d="M52 285 H360" stroke="url(#cyan)" stroke-width="3" filter="url(#glow)"/>
  </g>

  <!-- build modules -->
  <g transform="translate(110 1295)">
    <path d="M0 0 H350 L390 40 V230 H0 Z" fill="url(#card)" stroke="#1E293B"/>
    <text x="28" y="52" class="section">04 · BUILD</text>

    <text x="32" y="105" class="code2">Automation  → save time</text>
    <text x="32" y="140" class="code2">Web Apps    → clean UX</text>
    <text x="32" y="175" class="code2">Dev Tools   → builder flow</text>
    <text x="32" y="210" class="code2">Products    → ideas shipped</text>
  </g>

  <!-- exploration -->
  <g transform="translate(555 1260)">
    <path d="M0 40 L45 0 H535 V275 H0 Z" fill="url(#card)" stroke="#1E293B"/>
    <text x="38" y="88" class="section">05 · EXPLORING</text>

    <rect x="38" y="122" width="420" height="96" rx="18" fill="#020617" stroke="#1E293B"/>
    <text x="65" y="157" class="code2">[01] AI-assisted workflows</text>
    <text x="65" y="187" class="code2">[02] Developer experience</text>
    <text x="65" y="217" class="code2">[03] Open-source collaboration</text>

    <text x="38" y="255" class="small">The future belongs to builders who keep shipping.</text>
  </g>

  <!-- bottom contact -->
  <g transform="translate(110 1530)">
    <path d="M0 0 H980" stroke="#1E293B"/>
    <text x="0" y="48" class="code2">EMAIL  adnaan.worker@gmail.com</text>
    <text x="420" y="48" class="code2">GITHUB  github.com/ad-naan</text>
    <text x="780" y="48" class="code2">WEB  adnaan.site</text>
  </g>
</svg>
